name: Build & Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: food-freshness-detector
          export_default_credentials: true

      - name: Configure Docker to push to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          IMAGE=us-central1-docker.pkg.dev/food-freshness-detector/food-freshness-repo/food-freshness:$GITHUB_SHA
          docker build -t $IMAGE .

      - name: Push image to Artifact Registry
        run: |
          IMAGE=us-central1-docker.pkg.dev/food-freshness-detector/food-freshness-repo/food-freshness:$GITHUB_SHA
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          IMAGE=us-central1-docker.pkg.dev/food-freshness-detector/food-freshness-repo/food-freshness:$GITHUB_SHA
          gcloud run deploy food-freshness-detection \
            --image $IMAGE \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi
