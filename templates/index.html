<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Freshness Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        .upload-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        input[type="file"] {
            margin: 20px 0;
        }

        button {
            background: #28a745;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #218838;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .result.fresh {
            color: #28a745;
        }

        .result.spoiled {
            color: #dc3545;
        }

        #preview {
            max-width: 300px;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Food Freshness Detector</h1>
    <div class="upload-container">
        <input type="file" id="fileInput" accept="image/*"><br>
        <img id="preview" src="#" alt="Image Preview" style="display:none;"><br>
        <button onclick="uploadFile()">Predict</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const fileInput = document.getElementById("fileInput");
        const preview = document.getElementById("preview");
        const resultDiv = document.getElementById("result");

        fileInput.addEventListener("change", function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = "block";
                }
                reader.readAsDataURL(file);
            }
        });

        async function uploadFile() {
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select an image first!");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            resultDiv.innerText = "Predicting...";
            resultDiv.className = "result";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();

                if (data.label) {
                    resultDiv.innerText = `Result: ${data.label.toUpperCase()} (Score: ${data.score.toFixed(2)})`;
                    resultDiv.className = "result " + (data.label === "fresh" ? "fresh" : "spoiled");
                } else {
                    resultDiv.innerText = `Error: ${data.error}`;
                    resultDiv.className = "result";
                }

            } catch (error) {
                resultDiv.innerText = "Error predicting image!";
                resultDiv.className = "result";
            }
        }
    </script>
</body>
</html>
